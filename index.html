<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สั่งงานรดน้ำระยะไกล (Fixed Sync)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
        .sched-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sched-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <div class="w-full max-w-md md:max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-green-600 to-green-500 p-5 text-white relative shadow-md">
            <div class="flex items-center justify-center md:justify-start gap-3">
                <span class="text-3xl">🥬</span>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-tight">Smart Farm Control</h1>
                    <p id="connectionStatus" class="text-xs text-green-100 font-medium bg-green-700/30 px-2 py-0.5 rounded-full inline-block mt-1">
                        Connecting...
                    </p>
                </div>
            </div>
            <!-- Sync Indicator -->
            <div id="syncIndicator" class="absolute top-5 right-5 w-3 h-3 rounded-full bg-white shadow-lg opacity-0 transition-opacity duration-300"></div>
        </div>

        <div class="flex flex-col md:flex-row">
            
            <!-- Left Side: Dashboard -->
            <div class="p-6 border-b md:border-b-0 md:border-r border-gray-100 bg-white md:w-1/3 flex flex-col justify-between">
                <div>
                    <h2 class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-4">Dashboard Overview</h2>
                    
                    <div class="space-y-4">
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div id="pumpStatusIcon" class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center transition-colors duration-300">
                                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                </div>
                                <div>
                                    <p class="text-xs text-gray-500">สถานะปั๊มน้ำ</p>
                                    <p id="pumpStatusText" class="font-bold text-gray-700 text-lg">ปิดอยู่</p>
                                </div>
                            </div>
                        </div>

                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-500">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                </div>
                                <div>
                                    <p class="text-xs text-gray-500">โหมดระบบ</p>
                                    <div id="workStatus" class="text-xs font-bold text-gray-500 bg-gray-200 px-2 py-0.5 rounded inline-block">
                                        ...
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Manual Controls -->
                <div class="mt-8">
                    <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-3">Manual Control</p>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="sendCommand('ON')" class="bg-green-500 hover:bg-green-600 active:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-green-200 transition transform active:scale-95 flex flex-col items-center justify-center gap-1">
                            <span class="text-2xl">💧</span>
                            <span>เปิดน้ำ</span>
                        </button>
                        <button onclick="sendCommand('OFF')" class="bg-red-500 hover:bg-red-600 active:bg-red-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-red-200 transition transform active:scale-95 flex flex-col items-center justify-center gap-1">
                            <span class="text-2xl">🛑</span>
                            <span>ปิดน้ำ</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Side: Schedule Settings -->
            <div class="p-6 bg-gray-50 md:w-2/3 md:bg-gray-50/50">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-gray-700 font-bold flex items-center">
                        <span class="bg-blue-100 text-blue-600 p-1.5 rounded-lg mr-2">⏰</span> 
                        ตั้งเวลาอัตโนมัติ
                    </h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <!-- Schedule 1 -->
                    <div class="sched-card bg-white p-5 rounded-xl shadow-sm border border-gray-100 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-green-500"></div>
                        <div class="flex justify-between items-center mb-4">
                            <span class="font-bold text-gray-800 text-sm">ช่วงที่ 1 (เช้า)</span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="en0" class="sr-only peer">
                                <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-green-500"></div>
                            </label>
                        </div>
                        
                        <div class="space-y-3">
                            <div class="flex items-center justify-between bg-gray-50 p-2 rounded-lg border border-gray-100">
                                <span class="text-xs text-gray-400">เวลาเริ่ม</span>
                                <div class="flex items-center font-mono font-bold text-gray-700">
                                    <select id="h0" class="bg-transparent outline-none cursor-pointer hover:text-green-600 focus:bg-white focus:ring-2 focus:ring-green-200 rounded"></select>
                                    <span class="mx-1">:</span>
                                    <select id="m0" class="bg-transparent outline-none cursor-pointer hover:text-green-600 focus:bg-white focus:ring-2 focus:ring-green-200 rounded"></select>
                                </div>
                            </div>
                            <div class="flex items-center justify-between bg-gray-50 p-2 rounded-lg border border-gray-100">
                                <span class="text-xs text-gray-400">นาน (นาที)</span>
                                <input type="number" id="du0" class="w-12 bg-transparent font-mono font-bold text-right outline-none text-gray-700 hover:text-green-600 focus:bg-white focus:ring-2 focus:ring-green-200 rounded" min="1" max="60">
                            </div>
                        </div>

                        <div class="mt-4 pt-4 border-t border-gray-100">
                            <p class="text-[10px] text-gray-400 mb-2 uppercase font-bold">Active Days</p>
                            <div class="flex justify-between" id="days0"></div>
                        </div>
                    </div>

                    <!-- Schedule 2 -->
                    <div class="sched-card bg-white p-5 rounded-xl shadow-sm border border-gray-100 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                        <div class="flex justify-between items-center mb-4">
                            <span class="font-bold text-gray-800 text-sm">ช่วงที่ 2 (เย็น)</span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="en1" class="sr-only peer">
                                <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-500"></div>
                            </label>
                        </div>
                        
                        <div class="space-y-3">
                            <div class="flex items-center justify-between bg-gray-50 p-2 rounded-lg border border-gray-100">
                                <span class="text-xs text-gray-400">เวลาเริ่ม</span>
                                <div class="flex items-center font-mono font-bold text-gray-700">
                                    <select id="h1" class="bg-transparent outline-none cursor-pointer hover:text-blue-600 focus:bg-white focus:ring-2 focus:ring-blue-200 rounded"></select>
                                    <span class="mx-1">:</span>
                                    <select id="m1" class="bg-transparent outline-none cursor-pointer hover:text-blue-600 focus:bg-white focus:ring-2 focus:ring-blue-200 rounded"></select>
                                </div>
                            </div>
                            <div class="flex items-center justify-between bg-gray-50 p-2 rounded-lg border border-gray-100">
                                <span class="text-xs text-gray-400">นาน (นาที)</span>
                                <input type="number" id="du1" class="w-12 bg-transparent font-mono font-bold text-right outline-none text-gray-700 hover:text-blue-600 focus:bg-white focus:ring-2 focus:ring-blue-200 rounded" min="1" max="60">
                            </div>
                        </div>

                        <div class="mt-4 pt-4 border-t border-gray-100">
                            <p class="text-[10px] text-gray-400 mb-2 uppercase font-bold">Active Days</p>
                            <div class="flex justify-between" id="days1"></div>
                        </div>
                    </div>

                    <!-- Save Button -->
                    <div class="md:col-span-2 mt-2">
                        <button id="btnSave" onclick="saveSchedule()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 transition transform active:scale-[0.98] flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                            บันทึกการตั้งค่าทั้งหมด
                        </button>
                    </div>

                </div>
            </div>
        </div>
        
        <div class="bg-gray-50 p-2 text-center border-t border-gray-100">
            <p class="text-[10px] text-gray-400">System Ready • Fixed Input Sync</p>
        </div>
    </div>

    <script>
        // --- Config ---
        const mqttBroker = "broker.hivemq.com";
        const mqttPort = 8884; 
        const clientId = "WebClient_" + Math.random().toString(16).substr(2, 8);
        
        const topicCmd = "farm/lettuce_001/cmd";
        const topicState = "farm/lettuce_001/state";
        const topicSetSched = "farm/lettuce_001/set_schedule";
        const topicGetSched = "farm/lettuce_001/get_schedule";
        const topicDataSched = "farm/lettuce_001/schedule_data";

        let client;
        let scheds = [
            { h:7, m:0, du:5, en:false, days:[true,true,true,true,true,true,true] },
            { h:17, m:0, du:5, en:false, days:[true,true,true,true,true,true,true] }
        ];
        const dayLabels = ["อา","จ","อ","พ","พฤ","ศ","ส"];
        let syncInterval;

        // Init HTML Options
        function initSelectors(hid, mid) {
            const h = document.getElementById(hid);
            const m = document.getElementById(mid);
            for(let i=0; i<24; i++) h.innerHTML += `<option value="${i}">${i.toString().padStart(2,'0')}</option>`;
            for(let i=0; i<60; i++) m.innerHTML += `<option value="${i}">${i.toString().padStart(2,'0')}</option>`;
        }
        initSelectors('h0', 'm0');
        initSelectors('h1', 'm1');

        function renderDayButtons(slotIndex) {
            const container = document.getElementById('days' + slotIndex);
            container.innerHTML = '';
            dayLabels.forEach((label, dayIdx) => {
                const isActive = scheds[slotIndex].days[dayIdx];
                let colorClass = "bg-white text-gray-400 border-gray-200 hover:border-gray-300";
                if (isActive) {
                    colorClass = (slotIndex === 0) 
                        ? "bg-green-500 text-white border-green-500 shadow-md shadow-green-200" 
                        : "bg-blue-500 text-white border-blue-500 shadow-md shadow-blue-200";
                }
                container.innerHTML += `
                    <div onclick="toggleDay(${slotIndex}, ${dayIdx})" 
                         class="w-8 h-8 rounded-full border flex items-center justify-center cursor-pointer text-xs font-bold transition-all duration-200 select-none ${colorClass}">
                        ${label}
                    </div>
                `;
            });
        }
        renderDayButtons(0);
        renderDayButtons(1);

        // --- Helper: ตรวจสอบว่าผู้ใช้กำลังพิมพ์/เลือกอยู่หรือไม่ ---
        function isInputFocused() {
            const el = document.activeElement;
            return (el && (el.tagName === 'INPUT' || el.tagName === 'SELECT'));
        }

        // --- MQTT ---
        function connectMQTT() {
            document.getElementById('connectionStatus').innerText = "Connecting...";
            document.getElementById('connectionStatus').className = "text-xs text-yellow-600 font-medium bg-yellow-100 px-2 py-0.5 rounded-full inline-block mt-1";
            
            client = new Paho.MQTT.Client(mqttBroker, mqttPort, clientId);
            client.onConnectionLost = onConnectionLost;
            client.onMessageArrived = onMessageArrived;
            client.connect({onSuccess:onConnect, useSSL:true});
        }

        function onConnect() {
            document.getElementById('connectionStatus').innerText = "Online";
            document.getElementById('connectionStatus').className = "text-xs text-green-700 font-medium bg-green-100 px-2 py-0.5 rounded-full inline-block mt-1 animate-pulse";
            
            client.subscribe(topicState);
            client.subscribe(topicDataSched);
            requestSync();
            clearInterval(syncInterval);
            syncInterval = setInterval(requestSync, 5000);
        }

        function requestSync() {
            if(client && client.isConnected()) {
                let msg = new Paho.MQTT.Message("GET");
                msg.destinationName = topicGetSched;
                client.send(msg);
                const ind = document.getElementById('syncIndicator');
                ind.style.opacity = 1; setTimeout(()=>ind.style.opacity=0, 500);
            }
        }

        function onConnectionLost(res) {
            document.getElementById('connectionStatus').innerText = "Offline";
            document.getElementById('connectionStatus').className = "text-xs text-red-100 font-medium bg-red-500/50 px-2 py-0.5 rounded-full inline-block mt-1";
            setTimeout(connectMQTT, 5000); 
        }

        function onMessageArrived(msg) {
            if (msg.destinationName === topicDataSched) {
                const data = JSON.parse(msg.payloadString);
                
                // *** จุดสำคัญ: ถ้าผู้ใช้กำลังกดเลือกค่าอยู่ (Focus) จะไม่อัปเดตค่าทับ ***
                if(data.schedules) {
                    scheds = data.schedules;
                    if (!isInputFocused()) {
                        updateUIFromData();
                    }
                }

                // ส่วนของการแสดงผลปุ่มบันทึกและสถานะอื่นๆ อัปเดตได้ตลอด
                const btn = document.getElementById('btnSave');
                if(btn.innerText.includes("กำลังบันทึก")) {
                    btn.innerHTML = `<span>✅</span> บันทึกเรียบร้อย`;
                    btn.classList.replace("bg-gray-400", "bg-green-600");
                    setTimeout(() => {
                        btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg> บันทึกการตั้งค่าทั้งหมด`;
                        btn.classList.replace("bg-green-600", "bg-blue-600");
                    }, 2000);
                }

                const isOn = data.isWatering;
                const isAuto = data.isAutoRun;
                const anyScheduleEnabled = scheds.some(s => s.en);
                
                const pumpText = document.getElementById('pumpStatusText');
                const pumpIcon = document.getElementById('pumpStatusIcon');
                
                if (isOn) {
                    pumpText.innerText = "กำลังรดน้ำ";
                    pumpText.className = "font-bold text-green-600 text-lg";
                    pumpIcon.className = "w-10 h-10 rounded-full bg-green-500 flex items-center justify-center text-white shadow-lg shadow-green-200 animate-pulse";
                } else {
                    pumpText.innerText = "ปิดอยู่";
                    pumpText.className = "font-bold text-gray-400 text-lg";
                    pumpIcon.className = "w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center text-white";
                }

                const wStatus = document.getElementById('workStatus');
                if(isOn) {
                    if(isAuto) {
                        wStatus.innerText = "Auto Running 🕒";
                        wStatus.className = "text-xs font-bold text-white bg-blue-500 px-2 py-0.5 rounded inline-block";
                    } else {
                        wStatus.innerText = "Manual Running 🖐️";
                        wStatus.className = "text-xs font-bold text-white bg-orange-500 px-2 py-0.5 rounded inline-block";
                    }
                } else {
                    if(anyScheduleEnabled) {
                        wStatus.innerText = "Auto Standby";
                        wStatus.className = "text-xs font-bold text-green-600 bg-green-100 px-2 py-0.5 rounded inline-block border border-green-200";
                    } else {
                        wStatus.innerText = "Manual Only";
                        wStatus.className = "text-xs font-bold text-gray-400 bg-gray-100 px-2 py-0.5 rounded inline-block border border-gray-200";
                    }
                }
            }
        }

        function updateUIFromData() {
            for(let i=0; i<2; i++) {
                document.getElementById('h'+i).value = scheds[i].h;
                document.getElementById('m'+i).value = scheds[i].m;
                document.getElementById('du'+i).value = scheds[i].du;
                document.getElementById('en'+i).checked = scheds[i].en;
                renderDayButtons(i);
            }
        }

        function toggleDay(slot, day) {
            scheds[slot].days[day] = !scheds[slot].days[day];
            renderDayButtons(slot);
        }

        function saveSchedule() {
            if(!client || !client.isConnected()) return alert("ยังไม่เชื่อมต่อ Server");
            
            // ทำให้ปุ่ม Input เสีย Focus เพื่อให้ระบบ Sync กลับมาทำงานต่อหลังจากบันทึกเสร็จ
            document.activeElement.blur(); 

            const btn = document.getElementById('btnSave');
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังบันทึก...`;
            btn.classList.replace("bg-blue-600", "bg-gray-400");

            for(let i=0; i<2; i++) {
                scheds[i].h = parseInt(document.getElementById('h'+i).value);
                scheds[i].m = parseInt(document.getElementById('m'+i).value);
                scheds[i].du = parseInt(document.getElementById('du'+i).value);
                scheds[i].en = document.getElementById('en'+i).checked;
            }

            const payload = { schedules: scheds };
            let message = new Paho.MQTT.Message(JSON.stringify(payload));
            message.destinationName = topicSetSched;
            client.send(message);
        }

        function sendCommand(cmd) {
            if(!client || !client.isConnected()) return;
            let message = new Paho.MQTT.Message(cmd);
            message.destinationName = topicCmd;
            client.send(message);
        }

        connectMQTT();
    </script>
</body>
</html>
