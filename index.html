<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Farm (Debug Mode)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ใช้ Library Paho MQTT เวอร์ชันเสถียร -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
        .sched-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        /* Console Log Style */
        .console-box { font-family: monospace; font-size: 10px; background: #1a1a1a; color: #00ff00; padding: 10px; height: 150px; overflow-y: auto; border-radius: 8px; margin-top: 20px; box-shadow: inset 0 0 10px #000; }
        .log-time { color: #888; margin-right: 5px; }
        .log-err { color: #ff5555; }
        .log-succ { color: #55ffff; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <div class="w-full max-w-md md:max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col">
        
        <!-- Header -->
        <div class="bg-gray-800 p-4 text-white flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🔧</span>
                <div>
                    <h1 class="text-lg font-bold">Smart Farm Debugger</h1>
                    <p id="connectionStatus" class="text-xs text-yellow-400">Connecting...</p>
                </div>
            </div>
            <div class="text-right">
                <div class="text-xs text-gray-400">RSSI</div>
                <div id="rssiText" class="font-bold text-green-400">-- dBm</div>
            </div>
        </div>

        <div class="flex flex-col md:flex-row">
            <!-- Left Side: Status -->
            <div class="p-6 border-b md:border-b-0 md:border-r border-gray-100 bg-white md:w-1/3">
                <div class="space-y-4">
                    <div class="bg-gray-50 p-4 rounded-xl border flex items-center justify-between">
                        <div>
                            <p class="text-xs text-gray-500">สถานะปั๊ม</p>
                            <p id="pumpStatusText" class="font-bold text-gray-700 text-lg">รอข้อมูล...</p>
                        </div>
                        <div id="pumpStatusIcon" class="w-8 h-8 rounded-full bg-gray-300"></div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="sendCommand('ON')" class="bg-green-600 text-white py-3 rounded-lg shadow font-bold hover:bg-green-700 active:scale-95 transition">เปิดน้ำ</button>
                        <button onclick="sendCommand('OFF')" class="bg-red-600 text-white py-3 rounded-lg shadow font-bold hover:bg-red-700 active:scale-95 transition">ปิดน้ำ</button>
                    </div>
                </div>
            </div>

            <!-- Right Side: Schedule -->
            <div class="p-6 bg-gray-50 md:w-2/3">
                <h2 class="text-gray-700 font-bold mb-2">⏰ ตั้งเวลา</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Schedule 1 -->
                    <div class="bg-white p-3 rounded-lg border shadow-sm">
                        <div class="flex justify-between mb-1"><span class="font-bold text-green-700 text-sm">เช้า</span> <input type="checkbox" id="en0" onchange="saveSchedule()"></div>
                        <div class="flex gap-1 text-sm"><select id="h0" class="bg-gray-100 rounded"></select>:<select id="m0" class="bg-gray-100 rounded"></select> นาน <input type="number" id="du0" class="w-10 bg-gray-100 text-center" min="1"> นาที</div>
                    </div>
                    <!-- Schedule 2 -->
                    <div class="bg-white p-3 rounded-lg border shadow-sm">
                        <div class="flex justify-between mb-1"><span class="font-bold text-blue-700 text-sm">เย็น</span> <input type="checkbox" id="en1" onchange="saveSchedule()"></div>
                        <div class="flex gap-1 text-sm"><select id="h1" class="bg-gray-100 rounded"></select>:<select id="m1" class="bg-gray-100 rounded"></select> นาน <input type="number" id="du1" class="w-10 bg-gray-100 text-center" min="1"> นาที</div>
                    </div>
                </div>
                
                <button id="btnRefresh" onclick="requestSync()" class="w-full mt-4 bg-gray-200 text-gray-600 py-2 rounded-lg text-sm hover:bg-gray-300">🔄 กดเพื่อรีเฟรชข้อมูล (Sync)</button>
            </div>
        </div>

        <!-- DEBUG CONSOLE -->
        <div class="p-4 bg-gray-900">
            <p class="text-xs text-gray-400 mb-1">System Log (ส่งรูปนี้มาถ้าใช้ไม่ได้):</p>
            <div id="consoleLog" class="console-box"></div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const mqttBroker = "broker.hivemq.com";
        const mqttPort = 8884; // Port สำหรับ WSS (Secure WebSocket)
        const clientId = "WebClient_" + Math.random().toString(16).substr(2, 8);
        
        // Topic (ต้องตรงกับ ESP32 เป๊ะๆ)
        const topicRoot = "farm/lettuce_001/"; // เช็ค Prefix
        const topicCmd = topicRoot + "cmd";
        const topicState = topicRoot + "state";
        const topicSetSched = topicRoot + "set_schedule";
        const topicGetSched = topicRoot + "get_schedule";
        const topicDataSched = topicRoot + "schedule_data";

        let client;
        let isConnected = false;

        // UI Initialization
        function initSelectors(hid, mid) {
            const h = document.getElementById(hid);
            const m = document.getElementById(mid);
            for(let i=0; i<24; i++) h.innerHTML += `<option value="${i}">${i.toString().padStart(2,'0')}</option>`;
            for(let i=0; i<60; i++) m.innerHTML += `<option value="${i}">${i.toString().padStart(2,'0')}</option>`;
        }
        initSelectors('h0', 'm0');
        initSelectors('h1', 'm1');

        // --- Logging Function ---
        function log(msg, type="info") {
            const box = document.getElementById('consoleLog');
            const time = new Date().toLocaleTimeString();
            let colorClass = "";
            if(type==="error") colorClass = "log-err";
            if(type==="success") colorClass = "log-succ";
            
            box.innerHTML += `<div><span class="log-time">[${time}]</span> <span class="${colorClass}">${msg}</span></div>`;
            box.scrollTop = box.scrollHeight; // Auto scroll to bottom
        }

        // --- MQTT Connection ---
        function connectMQTT() {
            log("Connecting to " + mqttBroker + ":" + mqttPort + "...", "info");
            document.getElementById('connectionStatus').innerText = "Connecting...";
            
            try {
                client = new Paho.MQTT.Client(mqttBroker, mqttPort, clientId);
                client.onConnectionLost = onConnectionLost;
                client.onMessageArrived = onMessageArrived;
                
                // Option สำหรับการเชื่อมต่อ
                const options = {
                    onSuccess: onConnect,
                    onFailure: onFail,
                    useSSL: true, // สำคัญมากสำหรับ GitHub Pages หรือเว็บ HTTPS
                    timeout: 5,
                    keepAliveInterval: 30
                };
                client.connect(options);
            } catch (e) {
                log("Error creating client: " + e.message, "error");
            }
        }

        function onConnect() {
            isConnected = true;
            log("✅ Connected to MQTT Broker!", "success");
            document.getElementById('connectionStatus').innerText = "Online";
            document.getElementById('connectionStatus').className = "text-xs text-green-400 font-bold";

            // Subscribe Topics
            log("Subscribing to topics...", "info");
            client.subscribe(topicState);
            client.subscribe(topicDataSched);
            
            // Request Initial Data
            requestSync();
        }

        function onFail(responseObject) {
            isConnected = false;
            log("❌ Connection Failed: " + responseObject.errorMessage, "error");
            document.getElementById('connectionStatus').innerText = "Failed";
            document.getElementById('connectionStatus').className = "text-xs text-red-500 font-bold";
            // Retry in 5s
            setTimeout(connectMQTT, 5000);
        }

        function onConnectionLost(responseObject) {
            isConnected = false;
            if (responseObject.errorCode !== 0) {
                log("⚠️ Connection Lost: " + responseObject.errorMessage, "error");
            }
            document.getElementById('connectionStatus').innerText = "Offline";
            document.getElementById('connectionStatus').className = "text-xs text-red-500 font-bold";
            setTimeout(connectMQTT, 5000);
        }

        function onMessageArrived(message) {
            const topic = message.destinationName;
            const payload = message.payloadString;
            log(`📥 Recv [${topic}]: ${payload.substring(0, 30)}...`, "info");

            if (topic === topicDataSched) {
                try {
                    const data = JSON.parse(payload);
                    log("Updating UI with JSON data...", "success");
                    
                    // RSSI
                    if(data.rssi) document.getElementById('rssiText').innerText = data.rssi + " dBm";
                    
                    // Status
                    const isOn = data.isWatering;
                    document.getElementById('pumpStatusText').innerText = isOn ? "กำลังรดน้ำ" : "ปิดอยู่";
                    document.getElementById('pumpStatusText').className = isOn ? "font-bold text-green-600 text-lg" : "font-bold text-gray-700 text-lg";
                    document.getElementById('pumpStatusIcon').className = isOn ? "w-8 h-8 rounded-full bg-green-500 border-4 border-green-200" : "w-8 h-8 rounded-full bg-gray-300";

                    // Schedules (Only update if not focused - simple check)
                    if(document.activeElement.tagName !== "SELECT" && document.activeElement.tagName !== "INPUT") {
                        if(data.schedules) {
                            for(let i=0; i<2; i++) {
                                document.getElementById('h'+i).value = data.schedules[i].h;
                                document.getElementById('m'+i).value = data.schedules[i].m;
                                document.getElementById('du'+i).value = data.schedules[i].du;
                                document.getElementById('en'+i).checked = data.schedules[i].en;
                            }
                        }
                    }
                } catch(e) {
                    log("Error parsing JSON: " + e.message, "error");
                }
            } else if (topic === topicState) {
                const isOn = payload === "ON";
                document.getElementById('pumpStatusText').innerText = isOn ? "กำลังรดน้ำ" : "ปิดอยู่";
                document.getElementById('pumpStatusIcon').className = isOn ? "w-8 h-8 rounded-full bg-green-500 border-4 border-green-200" : "w-8 h-8 rounded-full bg-gray-300";
            }
        }

        function sendCommand(cmd) {
            if(!isConnected) { log("Cannot send: Not connected", "error"); return; }
            log("📤 Sending CMD: " + cmd, "info");
            let message = new Paho.MQTT.Message(cmd);
            message.destinationName = topicCmd;
            client.send(message);
        }

        function requestSync() {
            if(!isConnected) return;
            log("📤 Requesting Sync...", "info");
            let message = new Paho.MQTT.Message("GET");
            message.destinationName = topicGetSched;
            client.send(message);
        }

        function saveSchedule() {
            if(!isConnected) { log("Cannot save: Not connected", "error"); return; }
            log("📤 Saving Schedule...", "info");
            
            let scheds = [];
            for(let i=0; i<2; i++) {
                scheds.push({
                    h: parseInt(document.getElementById('h'+i).value),
                    m: parseInt(document.getElementById('m'+i).value),
                    du: parseInt(document.getElementById('du'+i).value),
                    en: document.getElementById('en'+i).checked,
                    days: [true,true,true,true,true,true,true]
                });
            }
            const payload = { schedules: scheds };
            let message = new Paho.MQTT.Message(JSON.stringify(payload));
            message.destinationName = topicSetSched;
            client.send(message);
        }

        // Start Connection
        log("System Init...", "info");
        connectMQTT();

    </script>
</body>
</html>
